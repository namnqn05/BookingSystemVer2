$kind: http-request
method: POST
url: '{{baseUrl}}/api/notifications/read-all'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => { pm.response.to.have.status(200); });
